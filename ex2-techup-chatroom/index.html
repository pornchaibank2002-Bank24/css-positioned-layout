<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
  <title>TechUp Chatroom</title>
</head>

<body>
  <div class="chat-app">
    <header class="topbar">
      <h1>Techup Chatroom</h1>
    </header>

    <main class="chat-room">
      <div class="message left first">
        <span class="emoji">😍</span>
      </div>

      <div class="message left second">
        <span class="emoji">😊</span>
      </div>

      <div class="message right greeting">สวัสดี</div>

      <div class="message right note">
        <span>Coding สนุกจังเลย</span>
        <span class="close">✕</span>
      </div>

      <div class="message right emoji-box">
        <span class="emoji">😊</span>
      </div>
    </main>
  </div>
</body>

</html>
